services:
  wiki:
    build: .
    image: climate-monitor-wiki:local
    container_name: climate-wiki-app
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      RELOAD_TOKEN: ${RELOAD_TOKEN:-}
      HERMES_HOME: /app/output/hermes
      HERMES_DASHBOARD_ENABLED: "1"
      HERMES_DASHBOARD_URL: http://127.0.0.1:9119
      CLIMATE_PUBLIC_ORIGIN: ${CLIMATE_PUBLIC_ORIGIN:-}
      CLIMATE_TASK_CONFIG: /app/output/task/task-definition.json
      CLIMATE_TASK_VERSION_DIR: /app/output/task/versions
      CLIMATE_ACQUISITION_RUN_DIR: /app/output/acquisition-runs
      CLIMATE_MANAGED_STATE_DIR: /app/output/monitor-state
      CLIMATE_REGISTRY_DB: /app/output/climate_registry.sqlite3
      CLIMATE_MONITOR_ENABLE_LIVE_WEB_LISTENING: ${CLIMATE_MONITOR_ENABLE_LIVE_WEB_LISTENING:-1}
      CLIMATE_REQUIRE_CONSOLE_AUTH: "1"
      CLIMATE_CONSOLE_USERNAME: ${CLIMATE_CONSOLE_USERNAME:-}
      CLIMATE_CONSOLE_PASSWORD_HASH: ${CLIMATE_CONSOLE_PASSWORD_HASH:-}
      CLIMATE_CONSOLE_SESSION_SECRET: ${CLIMATE_CONSOLE_SESSION_SECRET:-}
      CLIMATE_CONSOLE_SESSION_SECONDS: ${CLIMATE_CONSOLE_SESSION_SECONDS:-1800}
      CLIMATE_CONSOLE_SESSION_DB: /app/output/console-sessions.sqlite3
      CLIMATE_CONSOLE_SECURE_COOKIE: ${CLIMATE_CONSOLE_SECURE_COOKIE:-true}
    volumes:
      # Bind-mount the content so an ingest run on the host is picked up by
      # POST /api/reload without rebuilding the image.
      - ./wiki:/app/wiki
      - ./sources:/app/sources
      - ./article_metadata:/app/article_metadata
      - climate_runtime:/app/output
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/api/config').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: climate-wiki-caddy
    restart: unless-stopped
    depends_on:
      - wiki
    environment:
      SITE_HOST: ${SITE_HOST:-172.31.10.77}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  climate_runtime:
