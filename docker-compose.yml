services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    image: climate-monitor-wiki:local
    container_name: climate-wiki-app
    ports:
      - "8501:8501"
    environment:
      - CLIMATE_REGISTRY_DB=/registry/article-registry.sqlite3
      - RELOAD_TOKEN=b49ca3d610ed7f41b6e24ecad794c28f21d9e6f5f06b965f
    volumes:
      - /home/ubuntu/climate_monitor_data/registry:/registry:rw
      - ./wiki:/app/wiki:ro
      - ./sources:/app/sources:ro
    expose:
      - "8501"

  caddy:
    image: caddy:2-alpine
    container_name: climate-wiki-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
