services:
  wiki:
    environment:
      HERMES_MANAGED_HISTORY_SOCKET: /run/host-hermes/history.sock
      HERMES_DASHBOARD_SESSION_TOKEN_FILE: /run/host-hermes/session-token
    volumes:
      - ${HERMES_DASHBOARD_RELAY_DIR:?set HERMES_DASHBOARD_RELAY_DIR to the host relay directory}:/run/host-hermes:ro
