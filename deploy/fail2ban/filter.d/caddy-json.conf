[Definition]
# Caddy writes structured JSON access logs (one object per line). Parsing the
# JSON fields directly is more robust than the "common log" transform, which
# would require rebuilding Caddy with the transform-encoder plugin — not an
# option for the stock caddy:2-alpine image used here.
#
# Caddy emits the timestamp as a float Unix epoch ("ts":1786397145.32).
datepattern = LongEpoch

# NOTE: \s* after every colon. Caddy emits compact JSON (no spaces), but any
# re-serialization of these logs (jq, a log shipper, a hand-written test
# fixture) adds them, and a filter that only matches the compact form fails
# silently — the jail loads fine and simply never bans. Tolerating optional
# whitespace costs nothing and removes a whole class of silent breakage.
#
# Multiple failregex lines are OR'd together.
failregex =
    # Auth failures and forbidden access (e.g. bad /api/reload tokens).
    ^.*"remote_ip":\s*"<HOST>".*"status":\s*(?:401|403).*$
    # Vulnerability scanners probing for well-known sensitive paths.
    ^.*"remote_ip":\s*"<HOST>".*"uri":\s*"[^"]*(?:/\.git|/\.env|/wp-admin|/wp-login\.php|/xmlrpc\.php|/phpmyadmin|/\.aws|/\.ssh|/vendor/phpunit|/config\.json|/actuator|/solr/|/cgi-bin/).*".*$
    # Known offensive-security / mass-scanning tools by User-Agent.
    ^.*"remote_ip":\s*"<HOST>".*"User-Agent":\s*\[\s*"(?i:[^"]*(?:sqlmap|nikto|nmap|masscan|wpscan|zgrab|dirbuster|gobuster|hydra))[^"]*"\s*\].*$

ignoreregex =

# NOTE ON 404 STORMS
# A blanket "ban any 404" rule is deliberately NOT used here. This service is a
# single-page app whose frontend legitimately requests assets that can 404
# during deploys, and a stray broken link would otherwise ban a real user.
# Path-specific probing above is the higher-signal, lower-false-positive rule.
# See the caddy-notfound jail for a deliberately loose, high-threshold
# catch-all instead.
