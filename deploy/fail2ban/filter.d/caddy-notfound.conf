[Definition]
# High-volume 404 catch-all for the Caddy JSON access log.
#
# Kept SEPARATE from caddy-json (and deliberately loose) because 404s are noisy
# and a low threshold would ban legitimate users hitting a broken link. This
# jail only exists to stop sustained directory-enumeration sweeps, so pair it
# with a high maxretry and a short findtime in jail.local.
#
# \s* after the colons: see the note in caddy-json.conf — compact-only regexes
# fail silently against any re-serialized JSON.
datepattern = LongEpoch

failregex = ^.*"remote_ip":\s*"<HOST>".*"status":\s*404.*$

ignoreregex =
