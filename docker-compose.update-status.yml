services:
  wiki:
    environment:
      CLIMATE_UPDATE_STATUS_DIR: /update-status
    volumes:
      - type: bind
        source: ${CLIMATE_UPDATE_STATUS_HOST_DIR:?set CLIMATE_UPDATE_STATUS_HOST_DIR to the external update-status directory}
        target: /update-status
        read_only: true
        bind:
          create_host_path: false
