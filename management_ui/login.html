<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Monitor console login</title><style>:root{font-family:system-ui;background:#f4f7f5;color:#15251f}body{display:grid;min-height:100vh;place-items:center}main{width:min(25rem,90vw);background:white;padding:2rem;border-radius:.6rem}label,input{display:block;width:100%;margin:.5rem 0}input,button{font:inherit;padding:.6rem}button{background:#236b56;color:white;border:0;border-radius:.3rem}#error{color:#9b2226}</style></head>
<body class="login"><main><h1>Climate monitor console</h1><p>Operator sign-in</p><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="error" role="alert"></p></form></main><script>document.querySelector('#login').addEventListener('submit',async(e)=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/manage/auth/login',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:f.get('username'),password:f.get('password')})});if(r.ok)location.href='/manage';else document.querySelector('#error').textContent=r.status===429?'Too many attempts. Try again later.':'Sign-in failed.'});</script></body></html>
