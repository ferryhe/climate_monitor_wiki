schema_version: site-scopes.v1
reviewed_at: 2026-05-14
site_scopes:
  - source_key: iais
    seed_urls:
      - https://www.iais.org/activities-topics/climate-risk/
      - https://www.iais.org/publications/
    include_patterns:
      - /news/
      - /activities-topics/climate-risk/
      - /publications/
    exclude_patterns:
      - /events/
      - /calendar/
    notes: Reviewed IAIS public publications and climate risk topic pages.
  - source_key: iea
    seed_urls:
      - https://www.iea.org/news
      - https://www.iea.org/topics/climate-change
      - https://www.iea.org/sitemap.xml
    include_patterns:
      - /news
      - /reports
      - /topics/climate-change
      - /sitemap.xml
    exclude_patterns:
      - /events
      - /jobs
    notes: Reviewed IEA public news, climate topic, and sitemap inventory after /reports returned 404.
  - source_key: ipcc
    seed_urls:
      - https://www.ipcc.ch/reports/
      - https://www.ipcc.ch/news/
    include_patterns:
      - /reports/
      - /news/
      - /assessment-report/
    exclude_patterns:
      - /calendar/
      - /events/
    notes: Reviewed IPCC report and news paths.
  - source_key: irff
    seed_urls:
