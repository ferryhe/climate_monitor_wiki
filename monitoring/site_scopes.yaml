      - /news
      - /publications
      - /climate
    exclude_patterns:
      - /events
    notes: Reviewed UNDP IRFF news and publications paths.
  - source_key: issa
    seed_urls: []
    include_patterns:
      - /news
      - /analysis
      - /topics
      - /publication
    exclude_patterns:
      - /events
      - /membership
    fetch_mode: browser
    fetch_config_json:
      user_agent_profile: browser
      wait_until: domcontentloaded
      extra_wait_ms: 2500
      timeout_ms: 25000
    notes: Reviewed ISSA with browser_rendered; homepage is reachable while news and analysis section seeds trigger security verification.
