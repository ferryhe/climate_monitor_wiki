services:
  wiki:
    environment:
      CLIMATE_REGISTRY_MANAGEMENT_IMPORT: "1"
      CLIMATE_REGISTRY_DB: /registry/article-registry.sqlite3
      CLIMATE_REGISTRY_BACKUP_DIR: /registry/pdf-intake-backups
    volumes:
      - type: bind
        source: ${CLIMATE_REGISTRY_HOST_DIR:?set CLIMATE_REGISTRY_HOST_DIR to the external registry directory}
        target: /registry
        read_only: false
        bind:
          create_host_path: false
