name: Climate Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout climate monitor wiki
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout web_listening
        uses: actions/checkout@v4
        with:
          repository: ferryhe/web_listening
          ref: b63652e80161784d7530a02d0e537805c3e74dbe
          path: external/web_listening
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ./external/web_listening

      - name: Run climate monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIMATE_MONITOR_SEARCH_MODEL: ${{ vars.CLIMATE_MONITOR_SEARCH_MODEL || 'gpt-5.2' }}
          CLIMATE_MONITOR_ENABLE_LIVE_RESEARCH: "1"
          WEB_LISTENING_PROJECT_PATH: ${{ github.workspace }}/external/web_listening
          CLIMATE_MONITOR_ENABLE_LIVE_WEB_LISTENING: "1"
        run: python scripts/run_climate_monitor.py

      - name: Validate generated wiki
        run: |
          python -m pytest
          node --check showcase/app.js

      - name: Upload generated monitor outputs
        uses: actions/upload-artifact@v4
        with:
          name: climate-monitor-generated
          path: |
            monitoring/state/
            sources/
            wiki/

  publish:
    runs-on: ubuntu-latest
    needs: monitor
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout climate monitor wiki
        uses: actions/checkout@v4

      - name: Download generated monitor outputs
        uses: actions/download-artifact@v4
        with:
          name: climate-monitor-generated
          path: .

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex/automated-climate-monitor
          git add monitoring/state/ sources/ wiki/
          if git diff --cached --quiet; then
            echo "No monitor changes to publish."
            exit 0
          fi
          git commit -m "docs: add automated climate monitor update"
          git push --force-with-lease origin codex/automated-climate-monitor
          existing_pr="$(gh pr view codex/automated-climate-monitor --json url --jq .url 2>/dev/null || true)"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request: $existing_pr"
            exit 0
          fi
          gh pr create \
            --title "Automated climate monitor update" \
            --body "Automated update from the climate monitor workflow." \
            --base main \
            --head codex/automated-climate-monitor
