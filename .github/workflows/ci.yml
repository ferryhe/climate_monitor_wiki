name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  issue158-vm-capability:
    if: github.repository == 'ferryhe/climate_monitor_wiki' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/agent/issue-158-vm-preflight'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify disposable VM, systemd and cgroup v2 without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_REPOSITORY') == 'ferryhe/climate_monitor_wiki'
          assert os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          assert os.environ.get('GITHUB_REF') == 'refs/heads/agent/issue-158-vm-preflight'
          assert os.geteuid() != 0, 'runner must begin unprivileged'
          assert Path('/proc/1/comm').read_text().strip() == 'systemd', 'PID 1 is not systemd'
          assert Path('/run/systemd/system').is_dir(), 'system manager unavailable'
          assert Path('/sys/fs/cgroup/cgroup.controllers').is_file(), 'not unified cgroup v2'
          assert any(line.split()[4] == '/sys/fs/cgroup' and
                     line.split(' - ')[1].split()[0] == 'cgroup2'
                     for line in Path('/proc/self/mountinfo').read_text().splitlines())
          # Root cgroup.events is optional; require it on the invocation's
          # actual child cgroup in the later real cleanup canary instead.
          root_events = Path('/sys/fs/cgroup/cgroup.events').is_file()
          vm = subprocess.run(['systemd-detect-virt', '--vm'],
                              check=True, capture_output=True, text=True)
          assert vm.stdout.strip() not in ('', 'none'), 'not a VM'
          manager = subprocess.run(['systemctl', 'show', '-p', 'Version', '--value'],
                                   check=True, capture_output=True, text=True)
          assert manager.stdout.strip(), 'system manager does not respond'
          sudo = subprocess.run(['sudo', '-n', 'true'], check=True,
                                capture_output=True, text=True)
          print(json.dumps({'vm': True, 'systemd_pid1': True,
                            'systemd_version': manager.stdout.strip(),
                            'cgroup_v2': True, 'root_cgroup_events': root_events,
                            'sudo_available': sudo.returncode == 0,
                            'system_units_created': 0,
                            'real_cgroup_cleanup_proven': False}))
          PY

      - name: Probe root-broker delegation with an empty payload cgroup
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$GITHUB_REPOSITORY" == ferryhe/climate_monitor_wiki && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/agent/issue-158-vm-preflight ]]
          cd /; unset PYTHONPATH PYTHONHOME PYTHONSTARTUP PYTHONINSPECT
          /usr/bin/sudo -n /usr/bin/python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import time
          import uuid

          def run(*args):
              return subprocess.run(args, check=True, capture_output=True, text=True,
                                    timeout=10, env={'PATH': '/usr/bin:/usr/sbin', 'LC_ALL': 'C'}).stdout.strip()

          assert os.geteuid() == 0
          assert Path('/proc/1/comm').read_text().strip() == 'systemd'
          assert run('/usr/bin/systemd-detect-virt', '--vm') not in ('', 'none')
          assert any(line.split()[4] == '/sys/fs/cgroup' and
                     line.split(' - ')[1].split()[0] == 'cgroup2'
                     for line in Path('/proc/self/mountinfo').read_text().splitlines())
          nonce = uuid.uuid4().hex
          unit = 'issue158-probe-' + nonce + '.service'
          description = 'issue158 delegated capability ' + nonce
          group = '/system.slice/' + unit
          path = '/sys/fs/cgroup' + group
          fragment = '/run/systemd/transient/' + unit
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          properties = ('Id,LoadState,Transient,Delegate,DelegateSubgroup,Description,InvocationID,'
                        'ControlGroup,FragmentPath,MainPID,User,ActiveState')

          def show():
              return dict(line.split('=', 1) for line in run(
                  '/usr/bin/systemctl', '--system', 'show', unit, '--property=' + properties).splitlines())

          def walk(absolute):
              fd = os.open('/', flags)
              try:
                  for part in absolute.strip('/').split('/'):
                      assert part not in ('', '.', '..')
                      child = os.open(part, flags, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  return fd
              except BaseException:
                  os.close(fd)
                  raise

          def owned(fd):
              s = os.fstat(fd)
              assert s.st_uid == s.st_gid == 0 and not s.st_mode & 0o022
              return s.st_dev, s.st_ino

          def read(fd, name):
              with os.fdopen(os.open(name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=fd)) as stream:
                  return stream.read().strip()

          def identity():
              current = show()
              for key, value in expected.items():
                  assert current.get(key) == value, ('identity mismatch', key)
              fd = walk(path)
              try:
                  assert owned(fd) == inode
              finally:
                  os.close(fd)
              return current

          def retired():
              current = show()
              return (current.get('LoadState') == 'not-found'
                      and not current.get('FragmentPath') and not current.get('ControlGroup')
                      and not os.path.lexists(fragment) and not os.path.lexists(path))

          def wait_retired(seconds):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  if retired():
                      return
                  time.sleep(0.1)
              raise AssertionError('unit/fragment/cgroup not retired')

          before = show()
          assert before['LoadState'] == 'not-found' and not before.get('FragmentPath')
          assert not before.get('ControlGroup') and not os.path.lexists(fragment) and not os.path.lexists(path)
          root_fd = None
          expected = None
          cleanup = None
          finished = False
          try:
              run('/usr/bin/systemd-run', '--system', '--collect', '--quiet', '--unit=' + unit,
                  '--description=' + description, '--property=Type=exec', '--property=User=root',
                  '--property=Group=root', '--property=Slice=system.slice', '--property=Delegate=yes',
                  '--property=DelegateSubgroup=supervisor', '--property=PrivateNetwork=yes',
                  '--property=NoNewPrivileges=yes', '--property=KillMode=control-group',
                  '--property=Restart=no', '--property=JobTimeoutSec=5s',
                  '--property=TimeoutStartSec=5s', '--property=RuntimeMaxSec=30s',
                  '--property=TasksMax=4', '--property=TimeoutStopSec=5s', '--property=StandardOutput=null',
                  '--property=StandardError=null', '/usr/bin/sleep', '30')
              created = show()
              invocation = created.get('InvocationID', '')
              assert re.fullmatch('[0-9a-f]{32}', invocation) and int(invocation, 16)
              cleanup = {'Id': unit, 'Description': description, 'InvocationID': invocation,
                         'Transient': 'yes', 'ControlGroup': created.get('ControlGroup'),
                         'FragmentPath': created.get('FragmentPath')}
              assert cleanup['ControlGroup'] and cleanup['FragmentPath']
              assert all(created.get(k) == v for k, v in cleanup.items())
              required = {'Id': unit, 'Transient': 'yes', 'Delegate': 'yes', 'User': 'root',
                          'LoadState': 'loaded', 'ActiveState': 'active',
                          'DelegateSubgroup': 'supervisor', 'Description': description,
                          'InvocationID': invocation, 'ControlGroup': group, 'FragmentPath': fragment}
              assert all(created.get(k) == v for k, v in required.items())
              root_fd = walk(path)
              inode = owned(root_fd)
              assert inode[0] == os.stat('/sys/fs/cgroup').st_dev
              expected = required
              assert os.getxattr(root_fd, 'user.delegate') == b'1'
              assert read(root_fd, 'cgroup.type') == 'domain' and not read(root_fd, 'cgroup.procs')
              pid = int(identity()['MainPID'])
              assert pid > 1
              assert re.search(r'^Uid:\s+0\s+0\s+0\s+0$', Path('/proc/' + str(pid) + '/status').read_text(), re.M)
              assert os.readlink('/proc/' + str(pid) + '/exe') == '/usr/bin/sleep'
              assert '0::' + group + '/supervisor' in Path('/proc/' + str(pid) + '/cgroup').read_text().splitlines()
              supervisor = os.open('supervisor', flags, dir_fd=root_fd)
              try:
                  owned(supervisor)
                  assert read(supervisor, 'cgroup.procs').splitlines() == [str(pid)]
              finally:
                  os.close(supervisor)
              identity()
              os.mkdir('payload', mode=0o755, dir_fd=root_fd)
              payload = os.open('payload', flags, dir_fd=root_fd)
              try:
                  child_inode = owned(payload)
                  assert child_inode[0] == inode[0]
                  assert dict(line.split() for line in read(payload, 'cgroup.events').splitlines())['populated'] == '0'
                  assert not read(payload, 'cgroup.procs') and not read(payload, 'cgroup.threads')
                  kill = os.stat('cgroup.kill', dir_fd=payload, follow_symlinks=False)
                  assert stat.S_ISREG(kill.st_mode) and kill.st_uid == kill.st_gid == 0
                  identity()
                  linked = os.stat('payload', dir_fd=root_fd, follow_symlinks=False)
                  assert (linked.st_dev, linked.st_ino) == child_inode
                  os.rmdir('payload', dir_fd=root_fd)
                  assert 'payload' not in os.listdir(root_fd)
              finally:
                  os.close(payload)
              identity()
              run('/usr/bin/systemctl', '--system', 'stop', unit)
              wait_retired(5)
              finished = True
              print(json.dumps({'delegated_probe_pass': True, 'real_cleanup_proven': False}))
          finally:
              try:
                  if not finished:
                      if not retired() and cleanup is not None:
                          current = show()
                          # Mutable activity is not a cleanup identity. Never stop a
                          # same-name replacement or an unproven invocation.
                          assert all(current.get(k) == v for k, v in cleanup.items())
                          run('/usr/bin/systemctl', '--system', 'stop', unit)
                      # If identity was never established, --collect and the 30s
                      # RuntimeMaxSec retire this disposable VM's failed probe.
                      wait_retired(40)
              finally:
                  if root_fd is not None:
                      os.close(root_fd)
          PY

  python-tests:
    name: python-tests (${{ matrix.python-version }})
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/issue-158-vm-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run full test suite
        run: |
          set -euo pipefail
          python -m pytest -q

  fixtures-umask0002:
    name: fixtures-umask0002 (${{ matrix.python-version }})
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/issue-158-vm-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt
      - name: Run permission-sensitive fixtures under collaborative umask
        run: |
          set -euo pipefail
          mkdir -p "$HOME/issue163-fixture-temp"
          chmod 0700 "$HOME/issue163-fixture-temp"
          umask 0002
          TMPDIR="$HOME/issue163-fixture-temp" python -m pytest -q -p no:cacheprovider \
            --basetemp="$HOME/issue163-fixture-temp/pytest" \
            tests/test_issue140_hermes_snapshot.py \
            tests/test_issue94_management_console.py \
            tests/test_issue157_host_exec.py \
            tests/test_issue161_source_permissions.py

  repository-checks:
    name: repository-checks
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/issue-158-vm-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Compile core Python packages
        run: |
          set -euo pipefail
          python -m compileall climate_monitor climate_registry

      - name: Check tracked files for host-specific paths
        run: |
          set -euo pipefail
          python scripts/check_tracked_host_paths.py

      - name: Check frontend JavaScript syntax
        run: |
          set -euo pipefail
          node --check showcase/app.js
          node --check management_ui/manage.js

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed changes for whitespace errors
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Check dispatched revision for whitespace errors
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff-tree --check --root -r "$HEAD_SHA"

  docker-build-smoke:
    name: docker-build-smoke
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/issue-158-vm-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise collaborative application source modes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import stat

          # This job's disposable checkout only; no private/external runtime inputs.
          for root in map(Path, ("climate_monitor", "climate_registry", "scripts")):
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  if path.is_dir() or path.suffix == ".py":
                      path.chmod(stat.S_IMODE(path.stat().st_mode) | stat.S_IWGRP)
                      assert path.stat().st_mode & stat.S_IWGRP, path
          PY

      - name: Build application image
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="${{ github.sha }}" \
            --tag climate-monitor-wiki:ci .

      - name: Run offline container smoke
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python -i climate-monitor-wiki:ci - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          # Inspect the actual image, without a source bind mount. Imports and
          # mode checks do not replace the installed-Hermes managed-start canary.
          for root in map(Path, ("/app/climate_monitor", "/app/climate_registry", "/app/scripts")):
              assert root.is_dir(), root
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  assert path.stat().st_mode & 0o022 == 0, path
          for name in ("docker_entrypoint.sh", "qualify_web_listening_playwright.py"):
              path = Path("/app/scripts") / name
              assert path.stat().st_mode & 0o111 == 0o111, path

          import agentic_wiki.wiki_agent
          import api_server
          import climate_delivery
          import climate_monitor
          import climate_registry
          import web_listening
          from climate_monitor.taxonomy import (
              DEFAULT_TAXONOMY_ID,
              DEFAULT_TAXONOMY_SHA256,
              load_article_taxonomy,
          )

          taxonomy = load_article_taxonomy()
          jsonschema_version = metadata.version("jsonschema")
          version_parts = jsonschema_version.split(".")

          assert DEFAULT_TAXONOMY_ID == "climate-actuarial-v1"
          assert DEFAULT_TAXONOMY_SHA256 == (
              "3deefa1cc0df7a2e1ce8ef538271c0ab4465bb928f20e6418aafc8a834794d94"
          )
          assert taxonomy.taxonomy_id == DEFAULT_TAXONOMY_ID
          assert taxonomy.sha256 == DEFAULT_TAXONOMY_SHA256
          assert len(taxonomy.categories) == 8
          assert metadata.version("hermes-agent") == "0.20.5"
          assert metadata.version("web-listening") == "0.1.0"
          assert __import__("shutil").which("hermes")
          assert int(version_parts[0]) == 4 and int(version_parts[1]) >= 23

          print(
              json.dumps(
                  {
                      "categories": len(taxonomy.categories),
                      "core_imports": "ok",
                      "policy_source_modes": "not_group_or_world_writable",
                      "jsonschema": jsonschema_version,
                      "taxonomy_id": taxonomy.taxonomy_id,
                      "taxonomy_sha256": taxonomy.sha256,
                  },
                  sort_keys=True,
              )
          )
          PY
