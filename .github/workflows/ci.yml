name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests (${{ matrix.python-version }})
    # This temporary branch exists only to exercise the exact #162 image.
    if: github.ref != 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run full test suite
        run: |
          set -euo pipefail
          python -m pytest -q

  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Compile core Python packages
        run: |
          set -euo pipefail
          python -m compileall climate_monitor climate_registry

      - name: Check tracked files for host-specific paths
        run: |
          set -euo pipefail
          python scripts/check_tracked_host_paths.py

      - name: Check frontend JavaScript syntax
        run: |
          set -euo pipefail
          node --check showcase/app.js
          node --check management_ui/manage.js

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed changes for whitespace errors
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Check dispatched revision for whitespace errors
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff-tree --check --root -r "$HEAD_SHA"

  docker-build-smoke:
    name: docker-build-smoke
    if: github.ref != 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise collaborative application source modes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import stat

          # This job's disposable checkout only; no private/external runtime inputs.
          for root in map(Path, ("climate_monitor", "climate_registry", "scripts")):
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  if path.is_dir() or path.suffix == ".py":
                      path.chmod(stat.S_IMODE(path.stat().st_mode) | stat.S_IWGRP)
                      assert path.stat().st_mode & stat.S_IWGRP, path
          PY

      - name: Build application image
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="${{ github.sha }}" \
            --tag climate-monitor-wiki:ci .

      - name: Run offline container smoke
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python -i climate-monitor-wiki:ci - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          # Inspect the actual image, without a source bind mount. Imports and
          # mode checks do not replace the installed-Hermes managed-start canary.
          for root in map(Path, ("/app/climate_monitor", "/app/climate_registry", "/app/scripts")):
              assert root.is_dir(), root
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  assert path.stat().st_mode & 0o022 == 0, path
          for name in ("docker_entrypoint.sh", "qualify_web_listening_playwright.py"):
              path = Path("/app/scripts") / name
              assert path.stat().st_mode & 0o111 == 0o111, path

          import agentic_wiki.wiki_agent
          import api_server
          import climate_delivery
          import climate_monitor
          import climate_registry
          import web_listening
          from climate_monitor.taxonomy import (
              DEFAULT_TAXONOMY_ID,
              DEFAULT_TAXONOMY_SHA256,
              load_article_taxonomy,
          )

          taxonomy = load_article_taxonomy()
          jsonschema_version = metadata.version("jsonschema")
          version_parts = jsonschema_version.split(".")

          assert DEFAULT_TAXONOMY_ID == "climate-actuarial-v1"
          assert DEFAULT_TAXONOMY_SHA256 == (
              "3deefa1cc0df7a2e1ce8ef538271c0ab4465bb928f20e6418aafc8a834794d94"
          )
          assert taxonomy.taxonomy_id == DEFAULT_TAXONOMY_ID
          assert taxonomy.sha256 == DEFAULT_TAXONOMY_SHA256
          assert len(taxonomy.categories) == 8
          assert metadata.version("hermes-agent") == "0.20.5"
          assert metadata.version("web-listening") == "0.1.0"
          assert __import__("shutil").which("hermes")
          assert int(version_parts[0]) == 4 and int(version_parts[1]) >= 23

          print(
              json.dumps(
                  {
                      "categories": len(taxonomy.categories),
                      "core_imports": "ok",
                      "policy_source_modes": "not_group_or_world_writable",
                      "jsonschema": jsonschema_version,
                      "taxonomy_id": taxonomy.taxonomy_id,
                      "taxonomy_sha256": taxonomy.sha256,
                  },
                  sort_keys=True,
              )
          )
          PY

  candidate-managed-start-canary:
    name: candidate-managed-start-canary
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
    steps:
      - name: Check out validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move validation script outside the build checkout
        run: |
          set -euo pipefail
          cp .github/scripts/issue162_managed_start_canary.py "$RUNNER_TEMP/issue162-canary.py"
      - name: Check out exact PR candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
      - name: Assert exact checkout and build candidate image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="$CANDIDATE_SHA" \
            --tag climate-monitor-wiki:issue162-exact .
      - name: Record exact candidate image identity
        run: |
          set -euo pipefail
          docker image inspect climate-monitor-wiki:issue162-exact | python3 -c '
          import json, os, sys
          image = json.load(sys.stdin)[0]
          environment = dict(item.split("=", 1) for item in image["Config"]["Env"] if "=" in item)
          candidate = os.environ["CANDIDATE_SHA"]
          assert environment.get("CLIMATE_REPOSITORY_COMMIT_SHA") == candidate
          print(json.dumps({"image_id": image["Id"], "candidate_commit": candidate}, sort_keys=True))
          '
          printf 'CANDIDATE_IMAGE_ID=%s\n' \
            "$(docker image inspect --format '{{.Id}}' climate-monitor-wiki:issue162-exact)" >> "$GITHUB_ENV"
      - name: Run installed-Hermes and reader managed-start canary offline
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1024m --cpus=1 --pids-limit=256 \
            --entrypoint python -i "${CANDIDATE_IMAGE_ID:?}" - \
            < "$RUNNER_TEMP/issue162-canary.py"
      - name: Repeat canary with collaborative application source modes
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1024m --cpus=1 --pids-limit=256 \
            --env ISSUE161_TEST_SHARED_SOURCE=1 \
            --entrypoint python -i "${CANDIDATE_IMAGE_ID:?}" - \
            < "$RUNNER_TEMP/issue162-canary.py"
