name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clone3-recognition:
    # Negative target-fd probe only; no valid placement or cleanup evidence.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'ferryhe/climate_monitor_wiki' && github.ref == 'refs/heads/agent/issue-158-clone3-canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Probe clone3 flag recognition with an invalid cgroup fd
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" != workflow_dispatch ||
                "${GITHUB_REPOSITORY:-}" != ferryhe/climate_monitor_wiki ||
                "${GITHUB_REF:-}" != refs/heads/agent/issue-158-clone3-canary ||
                "${RUNNER_ENVIRONMENT:-}" != github-hosted ||
                "${GITHUB_ACTIONS:-}" != true || "$UID" == 0 || "$EUID" == 0 ]]; then
            printf '%s\n' 'FAIL: requires exact dispatch and non-root GitHub-hosted runner' >&2
            exit 1
          fi
          /usr/bin/cc -x c -std=c11 -Wall -Wextra -Werror -O2 -o "${RUNNER_TEMP:?}/issue158-clone3-recognition" - <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <limits.h>
          #include <linux/sched.h>
          #include <signal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <sys/wait.h>
          #include <unistd.h>

          static void report_errno(const char *reason, int error)
          {
              const char *name = strerrorname_np(error);
              fprintf(stderr, "FAIL: %s; errno=%d (%s): %s\n",
                      reason, error, name ? name : "UNKNOWN", strerror(error));
          }

          int main(void)
          {
              if (getuid() == 0 || geteuid() == 0) {
                  fputs("FAIL: refusing root execution\n", stderr);
                  return 1;
              }
              int pidfd = -1;
              struct clone_args args = {0};
              args.flags = CLONE_INTO_CGROUP | CLONE_PIDFD;
              /* In-range but impossible FD: UINT64_MAX is rejected as EINVAL
               * before the cgroup FD lookup on Linux 6.8. */
              args.cgroup = INT_MAX;
              args.pidfd = (uint64_t)(uintptr_t)&pidfd;
              args.exit_signal = SIGCHLD;
              long result = syscall(SYS_clone3, &args, sizeof args);
              int error = errno;
              if (result == 0)
                  _exit(120);
              if (result > 0) {
                  int status;
                  pid_t waited;
                  do {
                      waited = waitpid((pid_t)result, &status, 0);
                  } while (waited == -1 && errno == EINTR);
                  if (waited == -1)
                      report_errno("waitpid for unexpected child", errno);
                  fputs("FAIL: clone3 unexpectedly created a child with invalid cgroup fd\n", stderr);
                  return 1;
              }
              if (result != -1 || error != EBADF) {
                  report_errno("clone3 expected -1/EBADF", error);
                  return 1;
              }
              puts("{ \"clone3_into_cgroup_invalid_fd_rejected_with_ebadf\": true, \"valid_target_placement_proven\": false, \"synthetic_atomic_containment_proven\": false, \"real_cleanup_proven\": false }");
              return 0;
          }
          C
          "${RUNNER_TEMP:?}/issue158-clone3-recognition"

  python-tests:
    name: python-tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run full test suite
        run: |
          set -euo pipefail
          python -m pytest -q

  fixtures-umask0002:
    name: fixtures-umask0002 (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt
      - name: Run permission-sensitive fixtures under collaborative umask
        run: |
          set -euo pipefail
          mkdir -p "$HOME/issue163-fixture-temp"
          chmod 0700 "$HOME/issue163-fixture-temp"
          umask 0002
          TMPDIR="$HOME/issue163-fixture-temp" python -m pytest -q -p no:cacheprovider \
            --basetemp="$HOME/issue163-fixture-temp/pytest" \
            tests/test_issue140_hermes_snapshot.py \
            tests/test_issue94_management_console.py \
            tests/test_issue157_host_exec.py \
            tests/test_issue161_source_permissions.py

  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Compile core Python packages
        run: |
          set -euo pipefail
          python -m compileall climate_monitor climate_registry

      - name: Check tracked files for host-specific paths
        run: |
          set -euo pipefail
          python scripts/check_tracked_host_paths.py

      - name: Check frontend JavaScript syntax
        run: |
          set -euo pipefail
          node --check showcase/app.js
          node --check management_ui/manage.js

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed changes for whitespace errors
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Check dispatched revision for whitespace errors
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff-tree --check --root -r "$HEAD_SHA"

  docker-build-smoke:
    name: docker-build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise collaborative application source modes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import stat

          # This job's disposable checkout only; no private/external runtime inputs.
          for root in map(Path, ("climate_monitor", "climate_registry", "scripts")):
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  if path.is_dir() or path.suffix == ".py":
                      path.chmod(stat.S_IMODE(path.stat().st_mode) | stat.S_IWGRP)
                      assert path.stat().st_mode & stat.S_IWGRP, path
          PY

      - name: Build application image
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="${{ github.sha }}" \
            --tag climate-monitor-wiki:ci .

      - name: Run offline container smoke
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python -i climate-monitor-wiki:ci - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          # Inspect the actual image, without a source bind mount. Imports and
          # mode checks do not replace the installed-Hermes managed-start canary.
          for root in map(Path, ("/app/climate_monitor", "/app/climate_registry", "/app/scripts")):
              assert root.is_dir(), root
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  assert path.stat().st_mode & 0o022 == 0, path
          for name in ("docker_entrypoint.sh", "qualify_web_listening_playwright.py"):
              path = Path("/app/scripts") / name
              assert path.stat().st_mode & 0o111 == 0o111, path

          import agentic_wiki.wiki_agent
          import api_server
          import climate_delivery
          import climate_monitor
          import climate_registry
          import web_listening
          from climate_monitor.taxonomy import (
              DEFAULT_TAXONOMY_ID,
              DEFAULT_TAXONOMY_SHA256,
              load_article_taxonomy,
          )

          taxonomy = load_article_taxonomy()
          jsonschema_version = metadata.version("jsonschema")
          version_parts = jsonschema_version.split(".")

          assert DEFAULT_TAXONOMY_ID == "climate-actuarial-v1"
          assert DEFAULT_TAXONOMY_SHA256 == (
              "3deefa1cc0df7a2e1ce8ef538271c0ab4465bb928f20e6418aafc8a834794d94"
          )
          assert taxonomy.taxonomy_id == DEFAULT_TAXONOMY_ID
          assert taxonomy.sha256 == DEFAULT_TAXONOMY_SHA256
          assert len(taxonomy.categories) == 8
          assert metadata.version("hermes-agent") == "0.20.5"
          assert metadata.version("web-listening") == "0.1.0"
          assert __import__("shutil").which("hermes")
          assert int(version_parts[0]) == 4 and int(version_parts[1]) >= 23

          print(
              json.dumps(
                  {
                      "categories": len(taxonomy.categories),
                      "core_imports": "ok",
                      "policy_source_modes": "not_group_or_world_writable",
                      "jsonschema": jsonschema_version,
                      "taxonomy_id": taxonomy.taxonomy_id,
                      "taxonomy_sha256": taxonomy.sha256,
                  },
                  sort_keys=True,
              )
          )
          PY
