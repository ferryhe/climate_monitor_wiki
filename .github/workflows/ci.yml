name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests (${{ matrix.python-version }})
    # This temporary branch exists only to exercise the exact #162 image.
    if: github.ref != 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run full test suite
        run: |
          set -euo pipefail
          python -m pytest -q

  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Compile core Python packages
        run: |
          set -euo pipefail
          python -m compileall climate_monitor climate_registry

      - name: Check tracked files for host-specific paths
        run: |
          set -euo pipefail
          python scripts/check_tracked_host_paths.py

      - name: Check frontend JavaScript syntax
        run: |
          set -euo pipefail
          node --check showcase/app.js
          node --check management_ui/manage.js

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed changes for whitespace errors
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Check dispatched revision for whitespace errors
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff-tree --check --root -r "$HEAD_SHA"

  docker-build-smoke:
    name: docker-build-smoke
    if: github.ref != 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise collaborative application source modes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import stat

          # This job's disposable checkout only; no private/external runtime inputs.
          for root in map(Path, ("climate_monitor", "climate_registry", "scripts")):
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  if path.is_dir() or path.suffix == ".py":
                      path.chmod(stat.S_IMODE(path.stat().st_mode) | stat.S_IWGRP)
                      assert path.stat().st_mode & stat.S_IWGRP, path
          PY

      - name: Build application image
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="${{ github.sha }}" \
            --tag climate-monitor-wiki:ci .

      - name: Run offline container smoke
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python -i climate-monitor-wiki:ci - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          # Inspect the actual image, without a source bind mount. Imports and
          # mode checks do not replace the installed-Hermes managed-start canary.
          for root in map(Path, ("/app/climate_monitor", "/app/climate_registry", "/app/scripts")):
              assert root.is_dir(), root
              for path in (root, *root.rglob("*")):
                  assert not path.is_symlink(), path
                  assert path.stat().st_mode & 0o022 == 0, path
          for name in ("docker_entrypoint.sh", "qualify_web_listening_playwright.py"):
              path = Path("/app/scripts") / name
              assert path.stat().st_mode & 0o111 == 0o111, path

          import agentic_wiki.wiki_agent
          import api_server
          import climate_delivery
          import climate_monitor
          import climate_registry
          import web_listening
          from climate_monitor.taxonomy import (
              DEFAULT_TAXONOMY_ID,
              DEFAULT_TAXONOMY_SHA256,
              load_article_taxonomy,
          )

          taxonomy = load_article_taxonomy()
          jsonschema_version = metadata.version("jsonschema")
          version_parts = jsonschema_version.split(".")

          assert DEFAULT_TAXONOMY_ID == "climate-actuarial-v1"
          assert DEFAULT_TAXONOMY_SHA256 == (
              "3deefa1cc0df7a2e1ce8ef538271c0ab4465bb928f20e6418aafc8a834794d94"
          )
          assert taxonomy.taxonomy_id == DEFAULT_TAXONOMY_ID
          assert taxonomy.sha256 == DEFAULT_TAXONOMY_SHA256
          assert len(taxonomy.categories) == 8
          assert metadata.version("hermes-agent") == "0.20.5"
          assert metadata.version("web-listening") == "0.1.0"
          assert __import__("shutil").which("hermes")
          assert int(version_parts[0]) == 4 and int(version_parts[1]) >= 23

          print(
              json.dumps(
                  {
                      "categories": len(taxonomy.categories),
                      "core_imports": "ok",
                      "policy_source_modes": "not_group_or_world_writable",
                      "jsonschema": jsonschema_version,
                      "taxonomy_id": taxonomy.taxonomy_id,
                      "taxonomy_sha256": taxonomy.sha256,
                  },
                  sort_keys=True,
              )
          )
          PY

  candidate-managed-start-canary:
    name: candidate-managed-start-canary
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
    steps:
      - name: Check out validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move validation script outside the build checkout
        run: |
          set -euo pipefail
          cp .github/scripts/issue162_managed_start_canary.py "$RUNNER_TEMP/issue162-canary.py"
      - name: Check out exact PR candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
      - name: Assert exact checkout and build candidate image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          docker build --pull \
            --build-arg CLIMATE_REPOSITORY_COMMIT_SHA="$CANDIDATE_SHA" \
            --tag climate-monitor-wiki:issue162-exact .
      - name: Record exact candidate image identity
        run: |
          set -euo pipefail
          docker image inspect climate-monitor-wiki:issue162-exact | python3 -c '
          import json, os, sys
          image = json.load(sys.stdin)[0]
          environment = dict(item.split("=", 1) for item in image["Config"]["Env"] if "=" in item)
          candidate = os.environ["CANDIDATE_SHA"]
          assert environment.get("CLIMATE_REPOSITORY_COMMIT_SHA") == candidate
          print(json.dumps({"image_id": image["Id"], "candidate_commit": candidate}, sort_keys=True))
          '
          printf 'CANDIDATE_IMAGE_ID=%s\n' \
            "$(docker image inspect --format '{{.Id}}' climate-monitor-wiki:issue162-exact)" >> "$GITHUB_ENV"
      - name: Run installed-Hermes and reader managed-start canary offline
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1024m --cpus=1 --pids-limit=256 \
            --entrypoint python -i "${CANDIDATE_IMAGE_ID:?}" - \
            < "$RUNNER_TEMP/issue162-canary.py"
      - name: Repeat canary with collaborative application source modes
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1024m --cpus=1 --pids-limit=256 \
            --env ISSUE161_TEST_SHARED_SOURCE=1 \
            --entrypoint python -i "${CANDIDATE_IMAGE_ID:?}" - \
            < "$RUNNER_TEMP/issue162-canary.py"

  host-installed-checkout-canary:
    name: host-installed-checkout-canary (NATIVE HOST)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/agent/issue-162-canary-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
      HERMES_REVISION: 5538bd1f933be2e94aca9755deca5cc59cccc553
    steps:
      - name: Check out validation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy native validation script before candidate checkout
        run: |
          set -euo pipefail
          cp .github/scripts/issue162_managed_start_canary.py "$RUNNER_TEMP/issue162-host-canary.py"
      - name: Check out exact PR candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 82f930cf01b8b90cc2ebc0b702bf4a0db6f55d5f
      - name: Install private host runtime and validate collaborative checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          phase=private_setup
          canary_root=''
          trap 'rc=$?; if (( rc != 0 )); then printf "NATIVE_HOST FAIL phase=%s class=CommandFailure\n" "$phase"; fi; if [[ -n "$canary_root" ]]; then rm -rf -- "$canary_root"; fi' EXIT
          canary_root=$(mktemp -d /tmp/issue161-native.XXXXXXXX)
          chmod 0700 "$canary_root"
          phase=checkout_identity
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          source_root=$PWD
          # Ubuntu 24.04's distro interpreter is root-owned rather than the
          # hosted toolcache's writable interpreter symlink target.
          phase=system_python_preflight
          /usr/bin/python3.12 -c 'import os,stat,sys; from pathlib import Path; p=Path("/usr/bin/python3.12"); s=p.stat(); assert sys.version_info[:2]==(3,12) and s.st_uid==0 and s.st_mode&0o022==0'
          # Install diagnostics stay private: failures expose phase/class only.
          phase=host_venv
          /usr/bin/python3.12 -m venv "$canary_root/venv" >"$canary_root/install.log" 2>&1
          phase=requirements_install
          "$canary_root/venv/bin/python" -m pip install -r requirements.txt >>"$canary_root/install.log" 2>&1
          phase=hermes_fetch
          git init -q "$canary_root/hermes-agent" >>"$canary_root/install.log" 2>&1
          git -C "$canary_root/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$canary_root/hermes-agent" fetch --depth 1 origin "$HERMES_REVISION" >>"$canary_root/install.log" 2>&1
          git -C "$canary_root/hermes-agent" checkout --detach FETCH_HEAD >>"$canary_root/install.log" 2>&1
          test "$(git -C "$canary_root/hermes-agent" rev-parse HEAD)" = "$HERMES_REVISION"
          phase=hermes_install
          "$canary_root/venv/bin/python" -m pip install --editable "$canary_root/hermes-agent[web,pty]" >>"$canary_root/install.log" 2>&1
          phase=pip_check
          "$canary_root/venv/bin/python" -m pip check >>"$canary_root/install.log" 2>&1
          phase=browser_sdk_install
          mkdir -p "$canary_root/reader/browser-runtimes"
          /usr/bin/python3.12 -m venv "$canary_root/reader/browser-runtimes/playwright" >>"$canary_root/install.log" 2>&1
          "$canary_root/reader/browser-runtimes/playwright/bin/python" -m pip install playwright==1.62.0 >>"$canary_root/install.log" 2>&1
          "$canary_root/reader/browser-runtimes/playwright/bin/python" -m pip check >>"$canary_root/install.log" 2>&1
          "$canary_root/reader/browser-runtimes/playwright/bin/python" -c 'import importlib.metadata as m; assert m.version("playwright") == "1.62.0"' >>"$canary_root/install.log" 2>&1
          # Venv templates can ship shared-writable activation scripts.
          # Harden only test-owned, single-link activation copies;
          # never relax the external-runtime reader or change packages.
          phase=venv_activation_modes
          for venv_dir in "$canary_root/venv" "$canary_root/reader/browser-runtimes/playwright"; do
            for name in Activate.ps1 activate activate.csh activate.fish; do
              activation="$venv_dir/bin/$name"
              if [[ ! -e "$activation" ]]; then continue; fi
              test -f "$activation" && test ! -L "$activation"
              test "$(stat -c %u "$activation")" = "$(id -u)"
              test "$(stat -c %h "$activation")" = 1
              chmod go-w "$activation"
            done
          done
          chmod 0700 "$canary_root/venv" "$canary_root/hermes-agent" "$canary_root/reader"
          mkdir "$canary_root/home"
          cp "$RUNNER_TEMP/issue162-host-canary.py" "$canary_root/canary.py"
          phase=native_managed_start
          cd "$canary_root"
          # Egress is NOT OS-disabled. No inference or real Hermes child is
          # launched; env -i and an empty private HOME exclude real credentials.
          # SDK inventory only: no Chromium launch or external tool registration.
          env -i PATH="$canary_root/venv/bin:/usr/bin:/bin" \
            HOME="$canary_root/home" TMPDIR="$canary_root" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            ISSUE161_NATIVE_HOST=1 ISSUE161_SOURCE_ROOT="$source_root" \
            CLIMATE_REPOSITORY_COMMIT_SHA="$CANDIDATE_SHA" \
            CLIMATE_WEB_LISTENING_DATA_DIR="$canary_root/reader" \
            "$canary_root/venv/bin/python" "$canary_root/canary.py"
