name: Issue 158 disposable VM capability preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify disposable VM, systemd and cgroup v2 without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          assert os.geteuid() != 0, 'runner must begin unprivileged'
          assert Path('/proc/1/comm').read_text().strip() == 'systemd', 'PID 1 is not systemd'
          assert Path('/run/systemd/system').is_dir(), 'system manager unavailable'
          assert Path('/sys/fs/cgroup/cgroup.controllers').is_file(), 'not unified cgroup v2'
          assert Path('/sys/fs/cgroup/cgroup.events').is_file(), 'cgroup events unavailable'
          vm = subprocess.run(['systemd-detect-virt', '--vm'],
                              check=True, capture_output=True, text=True)
          assert vm.stdout.strip() not in ('', 'none'), 'not a VM'
          manager = subprocess.run(['systemctl', 'show', '-p', 'Version', '--value'],
                                   check=True, capture_output=True, text=True)
          assert manager.stdout.strip(), 'system manager does not respond'
          sudo = subprocess.run(['sudo', '-n', 'true'], check=True,
                                capture_output=True, text=True)
          print(json.dumps({'vm': True, 'systemd_pid1': True,
                            'systemd_version': manager.stdout.strip(),
                            'cgroup_v2': True, 'sudo_available': sudo.returncode == 0,
                            'system_units_created': 0,
                            'real_cgroup_cleanup_proven': False}))
          PY
